<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12151d">
<title>ゲーム一覧</title>
<style>
:root{--bg:#12151d;--panel:#1b202c;--line:#2c3344;--ink:#ebe5d4;--muted:#9a9fae;--gold:#d6a84e;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:32px max(16px,env(safe-area-inset-left,0px)) 40px}
h1{font-size:1.2rem;letter-spacing:.08em;margin:0 0 20px}
a.game{display:flex;gap:14px;align-items:center;padding:14px;margin-bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:inherit;text-decoration:none}
a.game:hover,a.game:focus-visible{border-color:var(--gold)}
a.game img{width:64px;height:64px;border-radius:12px;flex:none}
a.game b{display:block;font-size:1.05rem}
a.game span{display:block;font-size:.8rem;color:var(--muted);margin-top:4px;line-height:1.5}
p{font-size:.78rem;color:var(--muted);line-height:1.7}
</style>
</head>
<body>
<main>
  <h1>ゲーム一覧</h1>
  <a class="game" href="hairo/">
    <img src="hairo/icons/icon-192.png" alt="">
    <div><b>灰狼</b><span>SRPG・全18章(試作)。傭兵団長アルトと、拾われた子シオの物語。</span></div>
  </a>
  <p>開いたあと、ブラウザのメニューから「ホーム画面に追加」するとアプリとして起動できます。セーブは端末のブラウザの中に残ります。</p>
</main>
</body>
</html>
